# Codex: the code tools for this repo, from `ds-code mcp`. Codex loads a project's own config only after
# you trust the project (it asks on first run). Needs `ds-code` on your PATH (`npm link`). Every tool
# only reads.
[mcp_servers.code]
command = "ds-code"
args = ["mcp"]
startup_timeout_sec = 30
